<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnrollEagle Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
        .warning { color: #ffaa44; }
        h2 { color: #00ffff; }
        pre { 
            white-space: pre-wrap; 
            word-wrap: break-word;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 3px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #00ff00;
            margin-top: 20px;
            background: white;
        }
    </style>
</head>
<body>
    <h1>🔍 EnrollEagle Diagnostic Tool</h1>
    
    <div class="section">
        <h2>🌐 Network Tests</h2>
        <div id="network-results">Testing...</div>
    </div>

    <div class="section">
        <h2>🎨 CSS Tests</h2>
        <div id="css-results">Testing...</div>
    </div>

    <div class="section">
        <h2>📱 DOM Inspection (from iframe)</h2>
        <div id="dom-results">Loading...</div>
    </div>

    <div class="section">
        <h2>📜 Console Errors</h2>
        <div id="console-results">Monitoring...</div>
    </div>

    <div class="section">
        <h2>🖼️ Live Application (in iframe)</h2>
        <iframe id="app-frame" src="http://localhost:5173"></iframe>
    </div>

    <script>
        const results = {
            network: {},
            css: {},
            dom: {},
            console: []
        };

        // Monitor console errors
        window.addEventListener('error', (e) => {
            results.console.push({
                type: 'error',
                message: e.message,
                file: e.filename,
                line: e.lineno
            });
            updateConsoleDisplay();
        });

        // Test network endpoints
        async function testNetwork() {
            const networkDiv = document.getElementById('network-results');
            
            // Test API endpoints
            try {
                const meResp = await fetch('http://localhost:5001/me', { 
                    credentials: 'include',
                    mode: 'cors'
                });
                results.network.me = {
                    status: meResp.status,
                    ok: meResp.ok,
                    statusText: meResp.statusText
                };
            } catch (e) {
                results.network.me = { error: e.message };
            }

            try {
                const schoolsResp = await fetch('http://localhost:5001/schools');
                results.network.schools = {
                    status: schoolsResp.status,
                    ok: schoolsResp.ok,
                    data: await schoolsResp.json()
                };
            } catch (e) {
                results.network.schools = { error: e.message };
            }

            // Test if Vite dev server is responding
            try {
                const viteResp = await fetch('http://localhost:5173');
                results.network.vite = {
                    status: viteResp.status,
                    ok: viteResp.ok,
                    contentType: viteResp.headers.get('content-type')
                };
            } catch (e) {
                results.network.vite = { error: e.message };
            }

            networkDiv.innerHTML = `<pre>${JSON.stringify(results.network, null, 2)}</pre>`;
        }

        // Test CSS loading
        async function testCSS() {
            const cssDiv = document.getElementById('css-results');
            
            try {
                const cssResp = await fetch('http://localhost:5173/src/styles.css');
                const cssText = await cssResp.text();
                
                results.css = {
                    loaded: cssResp.ok,
                    status: cssResp.status,
                    size: cssText.length,
                    hasTailwind: cssText.includes('tailwindcss'),
                    hasImport: cssText.includes('@import'),
                    preview: cssText.substring(0, 500)
                };
            } catch (e) {
                results.css = { error: e.message };
            }

            cssDiv.innerHTML = `<pre>${JSON.stringify(results.css, null, 2)}</pre>`;
        }

        // Inspect iframe DOM after load
        const iframe = document.getElementById('app-frame');
        iframe.addEventListener('load', () => {
            setTimeout(() => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const root = iframeDoc.getElementById('root');
                    
                    results.dom = {
                        rootExists: !!root,
                        rootHTML: root ? root.innerHTML.substring(0, 1000) : 'Not found',
                        rootChildCount: root ? root.children.length : 0,
                        bodyClasses: iframeDoc.body.className,
                        stylesheetCount: iframeDoc.styleSheets.length,
                        visibleText: iframeDoc.body.innerText.substring(0, 500)
                    };

                    // Check computed styles
                    if (root && root.children.length > 0) {
                        const firstChild = root.children[0];
                        const computedStyle = iframe.contentWindow.getComputedStyle(firstChild);
                        results.dom.firstChildStyles = {
                            display: computedStyle.display,
                            visibility: computedStyle.visibility,
                            opacity: computedStyle.opacity,
                            color: computedStyle.color,
                            backgroundColor: computedStyle.backgroundColor,
                            fontSize: computedStyle.fontSize
                        };
                    }

                    // Check for login elements
                    const buttons = iframeDoc.querySelectorAll('button');
                    const links = iframeDoc.querySelectorAll('a');
                    results.dom.elements = {
                        buttonCount: buttons.length,
                        linkCount: links.length,
                        buttonTexts: Array.from(buttons).map(b => b.textContent.trim()).filter(Boolean),
                        linkTexts: Array.from(links).map(l => l.textContent.trim()).filter(Boolean)
                    };

                    document.getElementById('dom-results').innerHTML = 
                        `<pre>${JSON.stringify(results.dom, null, 2)}</pre>`;
                } catch (e) {
                    document.getElementById('dom-results').innerHTML = 
                        `<span class="error">Error accessing iframe: ${e.message}</span>`;
                }
            }, 1000);
        });

        function updateConsoleDisplay() {
            document.getElementById('console-results').innerHTML = 
                results.console.length > 0 
                    ? `<pre class="error">${JSON.stringify(results.console, null, 2)}</pre>`
                    : '<span class="success">No errors detected</span>';
        }

        // Run tests
        testNetwork();
        testCSS();
        updateConsoleDisplay();

        // Auto-refresh results every 5 seconds
        setInterval(() => {
            testNetwork();
            testCSS();
        }, 5000);
    </script>
</body>
</html>
