version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adddropper
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/adddropper
      SESSION_SECRET: replace-with-strong-secret-at-least-32-chars
      APP_URL: http://localhost:3000
      APP_NAME: AddDropper
      SUPPORT_EMAIL: support@adddropper.com
      POLL_INTERVAL_SECONDS: 90
      MAX_WATCH_ITEMS_FREE: 10
      ALERT_DEDUP_HOURS: 6
      ALERT_ON_WAITLIST: 'false'
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ''
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: 'AddDropper <no-reply@adddropper.com>'
      SENDGRID_API_KEY: ''
      ADMIN_EMAILS: admin@example.com
    ports:
      - '3000:3000'

  worker:
    build: .
    depends_on:
      - db
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/adddropper
      SESSION_SECRET: replace-with-strong-secret-at-least-32-chars
      APP_URL: http://localhost:3000
      APP_NAME: AddDropper
      SUPPORT_EMAIL: support@adddropper.com
      POLL_INTERVAL_SECONDS: 90
      MAX_WATCH_ITEMS_FREE: 10
      ALERT_DEDUP_HOURS: 6
      ALERT_ON_WAITLIST: 'false'
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ''
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: 'AddDropper <no-reply@adddropper.com>'
      SENDGRID_API_KEY: ''
      ADMIN_EMAILS: admin@example.com

volumes:
  db_data:
