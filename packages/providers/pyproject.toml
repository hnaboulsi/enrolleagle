[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrolleagle-providers"
version = "0.1.0"
description = "Provider adapters and parsers for EnrollEagle"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "selectolax>=0.3.24"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["enrolleagle_providers*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
