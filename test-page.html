<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnrollEagle Test Page</title>
    <script>
        // Diagnostic script to check what's happening
        window.addEventListener('DOMContentLoaded', async () => {
            const results = {
                timestamp: new Date().toISOString(),
                pageUrl: window.location.href,
                rootElement: null,
                cssLoaded: false,
                apiStatus: {},
                consoleErrors: []
            };

            // Check root element
            const root = document.getElementById('root');
            if (root) {
                results.rootElement = {
                    exists: true,
                    innerHTML: root.innerHTML.substring(0, 500),
                    childCount: root.children.length
                };
            }

            // Check CSS
            results.cssLoaded = document.styleSheets.length > 0;
            results.stylesheetCount = document.styleSheets.length;

            // Test API endpoints
            try {
                const meResp = await fetch('http://localhost:5001/me', { credentials: 'include' });
                results.apiStatus.me = { status: meResp.status, ok: meResp.ok };
            } catch (e) {
                results.apiStatus.me = { error: e.message };
            }

            try {
                const schoolsResp = await fetch('http://localhost:5001/schools');
                results.apiStatus.schools = { status: schoolsResp.status, ok: schoolsResp.ok };
            } catch (e) {
                results.apiStatus.schools = { error: e.message };
            }

            console.log('=== DIAGNOSTIC RESULTS ===');
            console.log(JSON.stringify(results, null, 2));
            
            // Display results on page
            document.body.innerHTML = '<pre style="font-family: monospace; padding: 20px; background: #f5f5f5;">' + 
                JSON.stringify(results, null, 2) + '</pre>';
        });

        // Capture console errors
        window.addEventListener('error', (e) => {
            console.error('Page Error:', e.message, e.filename, e.lineno);
        });
    </script>
</head>
<body>
    <h1>Loading diagnostics...</h1>
    <p>Open browser console (F12) to see detailed results</p>
    <iframe src="http://localhost:5173" style="width: 100%; height: 600px; border: 2px solid #ccc; margin-top: 20px;"></iframe>
</body>
</html>
